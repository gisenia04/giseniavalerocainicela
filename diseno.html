<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gise Portfolio</title>

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="general.css">
</head>
<body>

<!-- HEADER -->
<header>
    <div class="container">
        <nav>
            <div class="logo-container">
                <img src="insti.jpeg" alt="Gisenia Valero" class="profile-pic">
                <a href="index.html" class="logo">Gise Portfolio</a>
            </div>

            <div class="menu-toggle" id="menu-toggle">☰</div>

            <ul class="nav-links" id="nav-links">
                <li><a href="habiliades.html">Habilidades</a></li>
                <li><a href="diseno.html">Diseños</a></li>
                <li><a href="proyectos.html">Actividades</a></li>
                <li><a href="contacto.html">Contactos</a></li>
                <li><a href="admin.html">Administrador</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- DISEÑOS -->
<section id="designs">
    <h2>Mis Diseños</h2>
    <div class="designs-gallery" id="design-gallery"></div>
</section>

<!-- FOOTER -->
<footer>
    <div class="container">
        <h3>Contáctame</h3>
        <p>¿Tienes un proyecto en mente? ¡Hablemos!</p>
        <div class="social-links">
            <a href="#"><i class="fab fa-whatsapp"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <p>&copy; 2025 Gise Portfolio</p>
    </div>
</footer>

<!-- SCRIPT GALERÍA DIRECTA -->
<script>
const galleryImages = [
    {
        src: "diseño01.jpg",
        title: "Flyer Promocional",
        desc: "Diseño publicitario"
    },
    {
        src: "imagen01.jpg",
        title: "Evento Académico",
        desc: "Diseño institucional"
    }
];

const gallery = document.getElementById("design-gallery");

galleryImages.forEach(img => {
    gallery.innerHTML += `
    <div class="design-item">
        <div class="image-wrapper">
            <img src="${img.src}" alt="${img.title}">

            <!-- ETIQUETAS -->
            <img src="stickers/gratis.png" class="tag tag-top-right">
            <img src="stickers/estrella.png" class="tag tag-top-left">
        </div>

        <div class="design-overlay">
            <h3>${img.title}</h3>
            <p>${img.desc}</p>
        </div>
    </div>`;
});
</script>

<!-- MENU -->
<script>
document.getElementById("menu-toggle").addEventListener("click", () => {
    document.getElementById("nav-links").classList.toggle("show");
});
</script>

</body>
</html>
